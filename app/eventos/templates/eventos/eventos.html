{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container mt-4">
    <h2 class="text-center mb-4">Eventos Disponíveis</h2>
    
    <div class="row row-cols-2 row-cols-md-3 row-cols-lg-4 g-4">
        {% for evento in eventos %}
        <div class="col">
            <div class="card h-100 shadow-sm border">
                <!-- Imagem -->
                <img src="{% static 'eventos/img/evento_padrao.png' %}" class="card-img-top" alt="Evento" style="height: 150px; object-fit: cover;">
                
                <!-- Conteúdo do card -->
                <div class="card-body d-flex flex-column justify-content-between">
                    <div>
                        <h5 class="card-title text-truncate">{{ evento.nome }}</h5>
                        <p class="card-text text-muted small">{{ evento.data }} | {{ evento.local }}</p>
                    </div>
                    <a href="{% url 'checkin_evento' evento.id %}" class="btn btn-primary btn-sm mt-auto">
                        Inscrever-se
                    </a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
